server {
    listen 80;
    server_name _;
    client_max_body_size 25M;  # увеличено ради загрузки документов для OCR/LayoutLM

    root /usr/share/nginx/html;
    index index.html;

    # Отдаём React SPA: любой неизвестный путь -> index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэшируем статические ассеты React подольше
    location /static/assets/ {
        expires 30d;
        access_log off;
    }

    # Всё, что идёт на /api/, проксируем на backend-контейнер.
    # "backend" — имя сервиса в docker-compose.yml, Docker сам резолвит его в IP
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # OCR/LayoutLM могут обрабатывать документ дольше обычного запроса
    }

    # Swagger UI и схема OpenAPI (drf-spectacular)
    location /swagger/ {
        proxy_pass http://backend:8000/swagger/;
        proxy_set_header Host $host;
    }

    location /schema/ {
        proxy_pass http://backend:8000/schema/;
        proxy_set_header Host $host;
    }

    # Django admin (если используется)
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
    }

    # Статика/медиа Django, если она не раздаётся через whitenoise
    location /django-static/ {
        proxy_pass http://backend:8000/static/;
    }

    # Загруженные документы (файлы, отданные через DocumentSerializer)
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
    }
}
